<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vídeos | EC OXE</title>
<meta name="description" content="Lances e partidas do EC OXE no Pro Clubs.">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="assets/img/escudo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body data-page="videos">
<nav id="nav"></nav>
<header class="page-head"><div class="wrap">

  <h1>Vídeos</h1>
  <p>Golaços, defesas e partidas completas.</p>
</div></header>

<section>
  <div class="wrap">
    <div class="toolbar">
      <button class="fbtn on" data-vf="T">Todos</button>

    <div class="empty-state" id="vnone" hidden>Nenhum vídeo por aqui ainda.</div>

  <button class="vclose" id="vclose" type="button" aria-label="Fechar">✕</button>

  <div class="vinfo" id="vinfo"></div>
</dialog>

<footer id="footer"></footer>
<script src="assets/js/data.js?v=4"></script>
