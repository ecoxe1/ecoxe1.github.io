<body data-page="recrutamento">
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<nav id="nav"></nav>
<main id="conteudo" tabindex="-1">
<header class="page-head"><div class="wrap">
  <div class="eyebrow">Recrutamento aberto</div>
  <h1>Jogue no <span data-nome></span></h1>
  <p id="posLine"></p>
</div></header>

<section>
  <div class="wrap two">
    <div id="recBox">
      <form class="panel" id="recForm" novalidate>
        <h3>Sua candidatura</h3>
        <div class="fgrid">
          <div><label for="psn">ID no jogo *<br><small>PSN ou gamertag</small></label><input id="psn" name="psn" autocomplete="off" maxlength="40" required></div>
          <div><label for="nick">Como quer ser chamado<br><small>opcional</small></label><input id="nick" name="nick" maxlength="40"></div>
          <div><label for="plataforma">Plataforma *</label>
            <select id="plataforma" name="plataforma"><option>PlayStation 5</option><option>Xbox Series</option><option>PC</option></select></div>
          <div><label for="contato">Contato *<br><small>Discord, WhatsApp ou Instagram</small></label><input id="contato" name="contato" maxlength="120" required></div>
          <div><label for="posicao">Posição principal *</label>
            <select id="posicao" name="posicao" required><option value="">Escolha</option><option>Goleiro</option><option>Zagueiro</option><option>Lateral</option><option>Volante</option><option>Meia</option><option>Ponta</option><option>Atacante</option></select></div>
          <div><label for="posicao2">Segunda posição<br><small>opcional</small></label>
            <select id="posicao2" name="posicao2"><option value="">Nenhuma</option><option>Goleiro</option><option>Zagueiro</option><option>Lateral</option><option>Volante</option><option>Meia</option><option>Ponta</option><option>Atacante</option></select></div>
          <div><label for="horarios">Horários livres</label><input id="horarios" name="horarios" maxlength="120" placeholder="ex.: seg a sex, depois das 21h"></div>
          <div><label for="experiencia">Experiência no Pro Clubs</label>
            <select id="experiencia" name="experiencia"><option value="">Escolha</option><option>Começando agora</option><option>Jogo casual</option><option>Já joguei em clube</option><option>Competitivo / liga</option></select></div>
          <div><label for="clube_anterior">Último clube</label><input id="clube_anterior" name="clube_anterior" maxlength="60"></div>
          <div><label for="lances">Link de lances<br><small>YouTube, Medal, Twitch...</small></label><input id="lances" name="lances" type="url" maxlength="300" placeholder="https://"></div>
          <div class="full"><label for="sobre">Fale um pouco de você</label><textarea id="sobre" name="sobre" maxlength="800"></textarea></div>
        </div>
        <div class="hp" aria-hidden="true"><label for="hp_campo">Deixe em branco</label><input id="hp_campo" name="hp_campo" type="text" tabindex="-1" autocomplete="off" data-lpignore="true" data-1p-ignore="true"></div>
        <div class="factions"><button class="btn btn-gold" id="recSend" type="submit">Enviar candidatura</button><small class="by">* obrigatório</small></div>
        <div class="msg" id="recMsg" role="status" hidden></div>
      </form>
    </div>
    <div class="side-col">
      <div class="panel"><h3>O que a gente espera</h3><ul class="reqs" id="reqs"></ul></div>
      <div class="panel"><h3>Como funciona</h3>
        <ol class="reqs"><li>Você manda a candidatura.</li><li>A diretoria chama você no contato informado.</li><li>Marcamos um teste em jogo, sem pressão.</li><li>Passou? Bem-vindo ao farol.</li></ol>
      </div>
    </div>
  </div>
</section>

</main>
